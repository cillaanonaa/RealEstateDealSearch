name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd propstream-clone/apps/backend && npm install && npm run build --if-present
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd propstream-clone/apps/frontend && npm install && npm run build --if-present
  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/propstream-backend:latest propstream-clone/apps/backend
      - run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/propstream-backend:latest
      - run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/propstream-frontend:latest propstream-clone/apps/frontend
      - run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/propstream-frontend:latest
